# cargo-nextest runs the Rust tests: `cargo nextest run --workspace`, which `cargo xtask test rust` runs. Each test
# runs in a process of its own, so a test that leans on what another test left in its process fails on its own.

experimental = ["setup-scripts"]

[profile.default]
# The slowest test takes about 15 s on a loaded machine. One that passes 15 s is named as slow, and one that passes
# 60 s hangs: the runner ends it and it fails, where a wait with no end held the whole run before.
slow-timeout = { period = "15s", terminate-after = 4 }
# A run names each test that failed, at once and again at its end, and goes on to the end of the suite.
fail-fast = false
failure-output = "immediate-final"

# A capture walks a scenario in tmux at three sizes, and bounds each of its own waits, for a screen and for its
# daemon, by its patience of 30 s, so its own error names the wait that failed. The runner ends it only past the sum
# of those bounds, which a loaded machine reaches before the bound of each other test.
[[profile.default.overrides]]
filter = "package(furb-frames) & test(/^capture::/)"
slow-timeout = { period = "15s", terminate-after = 12 }

# A life of a test on a fake claude writes the turns that its command line resumes in the config dir of claude, which
# is the one of the person unless CLAUDE_CONFIG_DIR names another: each test run gives its tests a folder of its own,
# under the target of the tree, which goes with it.
[scripts.setup.claude]
command = [
  "sh",
  "-c",
  'mkdir -p target/claude && echo "CLAUDE_CONFIG_DIR=$(mktemp -d "$PWD/target/claude/run-XXXXXX")" >> "$NEXTEST_ENV"',
]

# A daemon of a test with no data folder of its own reads the one of the person, where each session with no project
# stands: each test run gives its tests a data folder of its own too.
[scripts.setup.data]
command = [
  "sh",
  "-c",
  'mkdir -p target/data && echo "XDG_DATA_HOME=$(mktemp -d "$PWD/target/data/run-XXXXXX")" >> "$NEXTEST_ENV"',
]

[[profile.default.scripts]]
platform = "cfg(unix)"
filter = "all()"
setup = ["claude", "data"]

# The census of flaky tests: a test that fails and then passes on a retry counts as failed, and is named as flaky,
# so a flake never hides behind a retry. `cargo nextest run --profile census`.
[profile.census]
retries = 2
flaky-result = "fail"
