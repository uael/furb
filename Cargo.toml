[package]
name = "furb"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "The core of an AI harness: the engine in a sandbox, behind an async API, with a World of your own."
license = "AGPL-3.0-only"
repository = "https://github.com/uael/furb"

[lib]
name = "furb"
path = "src/lib.rs"
# A library to a Rust host, and the extension module of the python distribution when the python feature is on.
crate-type = ["rlib", "cdylib"]

[features]
# The python binding: the same crate, reached from python. It links no interpreter of its own, which is what an
# extension module is, so the module feature is on only where maturin builds the wheel.
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]
typescript = ["dep:napi", "dep:napi-derive", "dep:napi-build", "dep:serde_json", "dep:indexmap", "dep:same-file", "dep:windows-sys"]

[dependencies]
# The sandbox the engine runs in, which is the reason the crate exists, and its
# type checker, which is the gate of the Kernel: ty as a library, reading the
# sheet of a word against the typeshed of the sandbox, so that a word which
# imports what monty does not run is refused before it runs. The python
# package gates through the same checker, so a word is judged once and the same.
#
# A revision of the fork and not a version, because the interpreter the engine
# needs is not released. A revision and not a branch, so a build of today and a
# build of next month read the same interpreter.
monty = { git = "https://github.com/uael/monty", rev = "54604c02" }
monty-type-checking = { git = "https://github.com/uael/monty", rev = "54604c02" }
monty-types = { git = "https://github.com/uael/monty", rev = "54604c02" }
pyo3 = { version = "0.29.2", features = ["generate-import-lib"], optional = true }
napi = { version = "3", default-features = false, features = ["napi6", "serde-json", "dyn-symbols"], optional = true }
napi-derive = { version = "3", optional = true }
serde_json = { version = "1", features = ["preserve_order", "raw_value"], optional = true }
indexmap = { version = "2", features = ["serde"], optional = true }
# The identity of a file on every system: the device and inode on Unix, and the volume serial number and file index
# on Windows, which the standard library reads only in an unstable API.
same-file = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
# The console of Windows, whose end the typescript binding hears.
windows-sys = { version = "0.61", features = ["Win32_System_Console"], optional = true }

[build-dependencies]
napi-build = { version = "2", optional = true }
