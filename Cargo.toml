[package]
name = "furb"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "The core of an AI harness: the engine in a sandbox, and a World of your own."
license = "AGPL-3.0-only"
repository = "https://github.com/uael/furb"

[features]
default = ["gate"]
# The gate of the crate: ty, as a library, reading the word of a rung before it runs.
gate = [
  "dep:ruff_db",
  "dep:ruff_python_ast",
  "dep:ruff_python_parser",
  "dep:salsa",
  "dep:ty_module_resolver",
  "dep:ty_python_core",
  "dep:ty_python_semantic",
  "dep:ty_vendored",
]
# A Session of monty, which is the sandbox the engine is meant to run in.
#
# It is off by default and takes the two crates by path, because the interpreter
# it needs is a fork of monty that is not released: the coroutine a Kernel
# drives, the `__await__` an act is said by, and the top level await a word of a
# model is compiled with are all on `uael/monty`, branch
# `claude/monty-furb-engine-api-6rbvfz`. It becomes an ordinary version
# dependency when that lands, and the two repositories sit side by side until
# then.
monty = ["dep:monty", "dep:monty-types"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ruff_db = { version = "0.0.9", optional = true }
ruff_python_ast = { version = "0.0.9", optional = true }
ruff_python_parser = { version = "0.0.9", optional = true }
salsa = { version = "0.28.2", default-features = false, features = ["compact_str", "macros", "salsa_unstable", "inventory"], optional = true }
ty_module_resolver = { version = "0.0.9", optional = true }
ty_python_core = { version = "0.0.9", optional = true }
ty_python_semantic = { version = "0.0.9", optional = true }
ty_vendored = { version = "0.0.9", optional = true }
monty = { path = "../monty/crates/monty", optional = true }
monty-types = { path = "../monty/crates/monty-types", optional = true }

[lib]
name = "furb"
path = "src/lib.rs"
