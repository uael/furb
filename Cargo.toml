[package]
name = "furb"
version.workspace = true
edition = "2024"
rust-version = "1.95"
description = "The core of an AI harness: the engine in a sandbox, behind an async API, with a World of your own."
license = "AGPL-3.0-only"
repository = "https://github.com/uael/furb"
readme = "README.md"
# What the crate on crates.io holds: the engine and what its build reads, the extensions that the crate carries, the
# doctrine, and the examples. The rest of the repository is other packages and their tests.
include = [
  "/build.rs",
  "/src/**",
  "/extensions/*/furb.json",
  "/extensions/*/*.py",
  "/extensions/*/tui.ts",
  "/extensions/*/*/SKILL.md",
  "/DOCTRINE.md",
  "/docs/examples/rust/*.rs",
  "/LICENSE",
  "/README.md",
]

[workspace]
# The command line is a program of its own on this crate, so the library takes none of its dependencies.
# The desktop app is a workspace of its own, since its web view needs libraries of the system that the gates of the
# crate do not install.
members = ["cli"]
exclude = ["gui/src-tauri"]

# The one version of furb: each crate takes it, and maturin gives it to the wheel of each crate.
[workspace.package]
version = "0.3.5"

[lib]
name = "furb"
path = "src/lib.rs"
# A library to a Rust host, and the extension module of the python distribution when the python feature is on.
crate-type = ["rlib", "cdylib"]

# The examples of the framework, one for each thing that it shows, which tests/examples.rs runs as programs.
[[example]]
name = "durable"
path = "docs/examples/rust/durable.rs"

[[example]]
name = "chains"
path = "docs/examples/rust/chains.rs"

[[example]]
name = "questions"
path = "docs/examples/rust/questions.rs"

[[example]]
name = "grant"
path = "docs/examples/rust/grant.rs"

[[example]]
name = "door"
path = "docs/examples/rust/door.rs"

[features]
# The counting allocator of monty as the global allocator of the program that links the crate, which the memory
# bound of the sandbox needs: without it the sandbox counts no byte, and only the operations that monty checks
# before they allocate are bound. A program that links the crate and names an allocator of its own leaves it off.
allocator = []
# The python binding: the same crate, reached from python. It links no interpreter of its own, which is what an
# extension module is, so the module feature is on only where maturin builds the wheel.
python = ["dep:pyo3", "allocator"]
extension-module = ["python", "pyo3/extension-module"]
typescript = ["dep:napi", "dep:napi-derive", "dep:napi-build", "allocator"]

[dependencies]
# The sandbox the engine runs in, and its type checker, which is the gate of the
# Kernel. A revision of the fork, since the interpreter the engine needs is not
# released, and a revision reads the same interpreter at every build.
monty = { git = "https://github.com/uael/monty", rev = "9f7098d6" }
monty-type-checking = { git = "https://github.com/uael/monty", rev = "9f7098d6" }
monty-types = { git = "https://github.com/uael/monty", rev = "9f7098d6" }
# The allocator that counts each byte the program asks for, which is how the interpreter reads its memory.
monty-alloc = { git = "https://github.com/uael/monty", rev = "9f7098d6" }
# A whole number past 64 bits, which a host hands in as its digits.
num-bigint = "0.4"
# The record: one fact per line, as JSON, whose numbers are read before anything rounds them. The catalog of models
# is JSON too, read into the shapes it holds.
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
serde = { version = "1", features = ["derive"] }
url = "2"
indexmap = { version = "2", features = ["serde"] }
# The search for a byte, which finds the end of each line of the record many bytes at a time, even in a build that
# does not optimize the crate.
memchr = "2"
# The store of a record as a database of SQLite, built from its source, so no machine needs a library of its own.
rusqlite = { version = "0.40", features = ["bundled"] }
# The chance of the World, drawn by the system.
getrandom = "0.3"
# The one interface of the models of the provider, which the claude command line answers too, and the clients of the
# providers of the network, over its TLS.
rig-core = { version = "=0.42.0", default-features = false, features = ["reqwest", "rustls"] }
# The client of HTTP that rig brings, which the servers of MCP and their logins take as it is.
reqwest = { version = "0.13", default-features = false }
# The providers of the clouds, which sign a request with the credentials of the cloud: Amazon Bedrock, and Google
# Vertex AI, whose key of an API the credentials of Google carry. The bytes of a request, which a client of HTTP
# that leaves a header out hands on.
rig-bedrock = "=0.42.0"
rig-vertexai = "=0.42.0"
google-cloud-auth = "1"
bytes = "1"
# The digest that names an image of a turn, and the form a request carries it in.
sha2 = "0.10"
base64 = "0.22"
# The reactor that wakes an ear when what it waits for is ready: a pipe of a command, a timer, a socket of a model,
# and the listener on 127.0.0.1 that takes back the code of a login to a server of MCP.
# Its macros select between what an ear hears and what its work comes to.
tokio = { version = "1", features = ["rt", "process", "io-util", "time", "sync", "macros", "net"] }
# The futures an ear holds and selects over, and the streams of a model.
futures = "0.3"
# The channels between an ear and its work, which stay on the thread of the life.
unsync = "0.2"
# The zones in which the usage limit of the claude command line names the moment it ends.
jiff = "0.2"
# A page of the web, which the extension web reads, as Markdown.
htmd = "0.5"
pyo3 = { version = "0.29.2", features = ["generate-import-lib", "indexmap", "multiple-pymethods"], optional = true }
napi = { version = "3", default-features = false, features = ["napi6", "serde-json", "dyn-symbols", "object_indexmap"], optional = true }
napi-derive = { version = "3", optional = true }
# No line of furb names salsa. The ruff crates 0.0.9 build on salsa 0.28.2 alone, and salsa 0.28.5 breaks them, so a
# crate that takes furb with no lock of ours builds only when furb pins salsa and its macros of rules.
salsa = { version = "=0.28.2", default-features = false }
salsa-macro-rules = "=0.28.2"
# The parser of the checker, which finds each import of a sheet for the sandbox to run.
ruff_python_parser = "0.0.9"
ruff_python_ast = "0.0.9"
ruff_text_size = "0.0.9"
# The builtins of python, which a name that a word deletes falls back to.
ruff_python_stdlib = "0.0.14"

[target.'cfg(unix)'.dependencies]
# The process group of a command, which the World ends whole.
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
# The console of Windows, whose end a host hears through a door.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
# The job that holds every process of a command, and ends them when it closes.
win32job = "2"

[dev-dependencies]
# The model of rig that answers from a script, which the tests of the provider ask.
rig-core = { version = "=0.42.0", default-features = false, features = ["test-utils"] }
# The validator of JSON Schema, which checks that a call of a binding of MCP sends what the tool asks.
jsonschema = { version = "0.33", default-features = false }

[build-dependencies]
napi-build = { version = "2", optional = true }
# The contract is read at the build, and every verb of it becomes a method of the engine and of each door. The
# engine is read too, and written again in layout alone, which is the system prompt.
ruff_python_parser = "0.0.9"
ruff_python_ast = "0.0.9"
ruff_text_size = "0.0.9"

# A dependency is built once and run many times: the interpreter runs every word of every test. A build for
# development builds each dependency as a release does, so a test runs them as a user does, and the crates of the
# workspace stay quick to build again.
[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false
