[package]
name = "furb"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "The core of an AI harness: the engine in a sandbox, and a World of your own."
license = "AGPL-3.0-only"
repository = "https://github.com/uael/furb"

[features]
default = ["gate"]
# The gate of the crate: ty, as a library, reading the word of a rung before it runs.
gate = [
  "dep:ruff_db",
  "dep:ruff_python_ast",
  "dep:ruff_python_parser",
  "dep:salsa",
  "dep:ty_module_resolver",
  "dep:ty_python_core",
  "dep:ty_python_semantic",
  "dep:ty_vendored",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ruff_db = { version = "0.0.9", optional = true }
ruff_python_ast = { version = "0.0.9", optional = true }
ruff_python_parser = { version = "0.0.9", optional = true }
salsa = { version = "0.28.2", default-features = false, features = ["compact_str", "macros", "salsa_unstable", "inventory"], optional = true }
ty_module_resolver = { version = "0.0.9", optional = true }
ty_python_core = { version = "0.0.9", optional = true }
ty_python_semantic = { version = "0.0.9", optional = true }
ty_vendored = { version = "0.0.9", optional = true }
# The sandbox the engine runs in, which is the reason the crate exists.
#
# A revision of the fork and not a version, because the interpreter the engine
# needs is not released: the coroutine a Kernel drives, the `__await__` an act
# is said by, the top level await a word of a model is compiled with, and the
# lazy generator expression the engine reads a record with are all on
# `uael/monty`. A revision and not a branch, so a build of today and a build of
# next month read the same interpreter.
monty = { git = "https://github.com/uael/monty", rev = "7601549" }
monty-types = { git = "https://github.com/uael/monty", rev = "7601549" }

[lib]
name = "furb"
path = "src/lib.rs"
