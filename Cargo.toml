[package]
name = "furb"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "The core of an AI harness: the engine in a sandbox, and a World of your own."
license = "AGPL-3.0-only"
repository = "https://github.com/uael/furb"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[lib]
name = "furb"
path = "src/lib.rs"
