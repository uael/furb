[package]
name = "furb"
version.workspace = true
edition = "2024"
rust-version = "1.95"
description = "The core of an AI harness: the engine in a sandbox, behind an async API, with a World of your own."
license = "AGPL-3.0-only"
repository = "https://github.com/uael/furb"

[workspace]
# The command line is a program of its own on this crate, so the library takes none of its dependencies.
members = ["cli"]

# The one version of furb: each crate takes it, and maturin gives it to the wheel of each crate.
[workspace.package]
version = "0.1.0"

[lib]
name = "furb"
path = "src/lib.rs"
# A library to a Rust host, and the extension module of the python distribution when the python feature is on.
crate-type = ["rlib", "cdylib"]

[features]
# The python binding: the same crate, reached from python. It links no interpreter of its own, which is what an
# extension module is, so the module feature is on only where maturin builds the wheel.
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]
typescript = ["dep:napi", "dep:napi-derive", "dep:napi-build", "dep:windows-sys"]

[dependencies]
# The sandbox the engine runs in, and its type checker, which is the gate of the
# Kernel. A revision of the fork, since the interpreter the engine needs is not
# released, and a revision reads the same interpreter at every build.
monty = { git = "https://github.com/uael/monty", rev = "63a8db44" }
monty-type-checking = { git = "https://github.com/uael/monty", rev = "63a8db44" }
monty-types = { git = "https://github.com/uael/monty", rev = "63a8db44" }
# An ear of the crate is a coroutine: a generator of rust, as an ear of python is a generator of python.
genawaiter = { version = "0.99", default-features = false }
# The record: one fact per line, as JSON, whose numbers are read before anything rounds them. The catalog of models
# is JSON too, read into the shapes it holds.
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
serde = { version = "1", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
# The chance of the World, drawn by the system.
getrandom = "0.3"
# The one interface of the models of the provider, which the claude command line answers too, and the clients of the
# providers of the network, over its TLS.
rig-core = { version = "=0.42.0", default-features = false, features = ["reqwest", "rustls"] }
# The providers of the clouds, which sign a request with the credentials of the cloud: Amazon Bedrock, and Google
# Vertex AI, whose key of an API the credentials of Google carry. The bytes of a request, which a client of HTTP
# that leaves a header out hands on.
rig-bedrock = "=0.42.0"
rig-vertexai = "=0.42.0"
google-cloud-auth = "1"
bytes = "1"
# The digest that names an image of a turn, and the form a request carries it in.
sha2 = "0.10"
base64 = "0.22"
# The runtime that each call of a model runs on, and the processes of the claude command line.
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "time", "sync"] }
futures = "0.3"
pyo3 = { version = "0.29.2", features = ["generate-import-lib"], optional = true }
napi = { version = "3", default-features = false, features = ["napi6", "serde-json", "dyn-symbols"], optional = true }
napi-derive = { version = "3", optional = true }
# The identity of a file on every system: the device and inode on Unix, and the volume serial number and file index
# on Windows, which the standard library reads only in an unstable API.
same-file = "1"
# The parser of the checker, which finds each import of a sheet for the sandbox to run.
ruff_python_parser = "0.0.9"
ruff_python_ast = "0.0.9"
ruff_text_size = "0.0.9"

[target.'cfg(unix)'.dependencies]
# The process group of a command, which the World ends whole.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The console of Windows, whose end the typescript binding hears.
windows-sys = { version = "0.61", features = ["Win32_System_Console"], optional = true }

[dev-dependencies]
# The model of rig that answers from a script, which the tests of the provider ask.
rig-core = { version = "=0.42.0", default-features = false, features = ["test-utils"] }

[build-dependencies]
napi-build = { version = "2", optional = true }
# The contract is read at the build, and every verb of it becomes a method of the engine and of each door. The
# engine is read too, and written again in layout alone, which is the system prompt.
ruff_python_parser = "0.0.9"
ruff_python_ast = "0.0.9"
ruff_text_size = "0.0.9"
