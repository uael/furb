# The limits of the runs of this repository. [local] and [ci] hold the seconds that a warm run of each part of the
# suite may take. A run past its limit fails and names its slowest tests. One home: the hooks and the gates both run
# each part through `cargo xtask budget`, which reads its limit here.
# [local] holds the limits of this machine, [ci] those of a runner of the gates, which is slower. A part with no limit
# here has none that its run fits yet: it reports its time and fails never.
# <part> is the wall time in seconds, and <part>_cpu the CPU time of the run and its children: a run past its wall limit on
# a loaded machine is judged by its CPU time, scaled by the speed of the machine as below. `cargo xtask budget --help` says how.
# Measured on 11-08, pytest: 37 to 45 s of wall and 160 s of CPU alone on this machine, 74 to 80 s of wall and 160 s of CPU
# beside 28 busy processes; on the runners, 54 to 117 s on ubuntu and macOS and 68 to 153 s on windows (the gates of 11-06 to
# 11-08). A limit is never raised to pass: make the run faster.
# cargo test --workspace, 11-08, warm, three runs at a load of 15 to 40 on 14 cores: 175 to 253 s of wall and 278 to 352 s of CPU;
# its binaries add up to about 70 s of wall on a quiet machine (the unit tests of furb 22 s, daemon 14 s, life 9 s). The limits
# below hold that measure with a margin, so a slower run fails; they are not the 60 s that the owner asks, which the causes
# named in the report of suite-time-regression-r1 stand in the way of.
# cargo nextest run --workspace, 11-15, warm, at a load of 5 to 20 on 14 cores: 38 to 49 s of wall and 281 s of CPU, since
# each test runs in a process of its own and no test program waits for another.
# The CPU time of the same work grows with the load on a Mac, whose load moves part of a run from its 10 cores of
# performance to its 4 cores of efficiency, where it costs 3 to 4 times as many CPU seconds. So each run measures the speed
# of the machine with a probe of fixed work, at its start and at its end, and scales each CPU limit by the ratio of the
# probe to probe_ms, the CPU milliseconds that the probe takes on this machine when quiet: the least of 10 probes on 11-16,
# at a load of 40 to 51. A quieter measure only lowers it.
[local]
pytest = 60
pytest_cpu = 240
cargo = 60
cargo_cpu = 360
probe_ms = 560

[ci]
pytest = 180

# The limits of the benches that no run of the suite makes. A test reads each key of this table, and the name of each
# key ends with its unit. `cargo xtask budget` reads only [local] and [ci], and ignores this table.
[bench]
# The most heap, in MiB, that a life of the last size of LARGE in crates/host/tests/suite/memory.rs may hold, when its
# test runs as `memory::bench -- --ignored`.
memory_heap_mib = 512
# The most allocations that each fact and each frame cost, for each system that measured them, in the table of its
# name (std::env::consts::OS). The allocations of the whole process count, std among them, which differ from one
# system to the next, so each bound is the measure of its own system, and one more allocation for each fact or each
# frame fails it. A system with no table bounds nothing yet, and its test prints the measure to set here.
# memory_allocs_per_fact: the growth of a life from one size to the next, over the facts that it said, at the sizes of
# the suite, which write no image. memory_allocs_per_fact_large: the same at the sizes of the bench, whose life writes
# its image each 10 000 facts. memory_allocs_per_frame: the daemon and the window, for each frame that a window reads
# when it attaches at the start of the log of a life, in the test of the slow window.
[bench.macos]
# Measured on 11-17, macOS 26, dev profile: 1405; 1448, 1409 and 1417; 23.
memory_allocs_per_fact = 1345
memory_allocs_per_fact_large = 1417
memory_allocs_per_frame = 23
