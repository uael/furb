default_install_hook_types: [pre-commit]
# Each hook runs once, before the commit. A hook of no stage also runs at the stage of the message, on that file alone,
# where each gate says that it found no files to check.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        # The animation of the TUI in the README is sharp at the cost of its size.
        exclude: ^docs/furb\.gif$
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-format
        # A word of the project keeps its own form, as the chain it runs in reads it.
        exclude: ^\.furb/
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.3
    hooks:
      - id: uv-lock

  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run ty check --error-on-warning
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        types_or: [python, pyi, toml, json]
        pass_filenames: false
      - id: fmt
        name: fmt
        entry: cargo fmt --all --check
        language: system
        types_or: [rust]
        pass_filenames: false
      - id: clippy
        name: clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types_or: [rust]
        pass_filenames: false
      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace
        language: system
        # The files that the crate and its tests read. The gates run every hook on every file.
        files: ^(src|cli|extensions|tests|docs/examples)/|^(build\.rs|Cargo\.toml|Cargo\.lock|DOCTRINE\.md)$
        pass_filenames: false
      - id: links
        name: the links of the READMEs of the packages
        # No sync: a sync in a new worktree builds the crate, and that outlasts a bash. The script reads git only.
        entry: uv run --no-sync python script/links.py
        language: system
        files: (^|/)(README\.md|pyproject\.toml|Cargo\.toml|package\.json)$
        pass_filenames: false
      - id: paths
        name: the paths that the scripts and the workflows name
        # Each commit runs it, since a move of a file in a commit that touches no script leaves the old path in one.
        entry: uv run --no-sync python script/paths.py
        language: system
        always_run: true
        pass_filenames: false
      - id: stray
        name: no backup or reject file
        entry: A backup or reject file of a patch or of sed is in the commit. Delete it.
        language: fail
        files: (\.rej|\.orig|-E)$
