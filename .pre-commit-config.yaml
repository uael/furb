default_install_hook_types: [pre-commit]
# Each hook runs once, before the commit. A hook of no stage also runs at the stage of the message, on that file alone,
# where each gate says that it found no files to check.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        # The animation of the TUI in the README is sharp at the cost of its size.
        # A record of the corpus holds a whole life with a checkpoint, and git keeps a copy of a record that a release
        # does not change once.
        exclude: ^(docs/furb\.gif|tests/corpus/.*\.jsonl)$
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-format
        # A word of the project keeps its own form, as the chain it runs in reads it.
        exclude: ^\.furb/
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.3
    hooks:
      - id: uv-lock

  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run ty check --error-on-warning
        language: system
        types_or: [python, pyi]
        # The files that the suite and the checker read: a python file or a manifest elsewhere changes neither.
        files: ^(src/furb/|test/|extensions/|\.furb/|bind/python/|script/|tests/|docs/examples/python/)|^pyproject\.toml$
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        # The suite drives the engine through furb-monty, which builds the crate, so a change of the Rust is read too.
        types_or: [python, pyi, toml, json, rust]
        files: ^(src/|build/|test/|extensions/|\.furb/|bind/python/|script/|tests/|docs/examples/python/)|^(pyproject|Cargo|rust-toolchain)\.toml$
        pass_filenames: false
      - id: fmt
        name: fmt
        entry: cargo fmt --all --check
        language: system
        types_or: [rust]
        pass_filenames: false
      - id: rustwidth
        name: no comment of rust goes past 100 characters
        entry: python3 script/rustwidth.py
        language: system
        files: (\.rs|^script/rustwidth\.py)$
        pass_filenames: false
      - id: clippy
        name: clippy
        # With the feature of the bindings of TypeScript, so the one run holds the code that the feature adds: the gates
        # run no other clippy on Linux.
        entry: cargo clippy --workspace --all-targets --features furb/typescript -- -D warnings
        language: system
        types_or: [rust]
        pass_filenames: false
      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace --features furb/typescript
        language: system
        # The files that the crate and its tests read. The gates run every hook on every file.
        files: ^(src|cli|extensions|tests|docs/examples)/|^(build\.rs|Cargo\.toml|Cargo\.lock|DOCTRINE\.md)$
        pass_filenames: false
      - id: links
        name: the links of the READMEs of the packages
        # No sync: a sync in a new worktree builds the crate, and that outlasts a bash. The script reads git only.
        entry: uv run --no-sync python script/links.py
        language: system
        files: (^|/)(README\.md|pyproject\.toml|Cargo\.toml|package\.json)$
        pass_filenames: false
      - id: paths
        name: the paths that the scripts and the workflows name
        # Each commit runs it, since a move of a file in a commit that touches no script leaves the old path in one.
        entry: uv run --no-sync python script/paths.py
        language: system
        always_run: true
        pass_filenames: false
      - id: workflows
        name: the workflows parse and keep their shape
        # Each commit runs it, a merge commit too, since a bad merge of a workflow shows in CI only after minutes.
        entry: uv run --no-sync python script/workflows.py
        language: system
        always_run: true
        pass_filenames: false
      - id: corpus
        name: no file of a folder of the corpus that a tag holds changes
        entry: python3 script/hooks/corpus.py
        language: system
        files: ^tests/corpus/
        pass_filenames: false
      - id: stray
        name: no backup or reject file
        entry: A backup or reject file of a patch or of sed is in the commit. Delete it.
        language: fail
        files: (\.rej|\.orig|-E)$
