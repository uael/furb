[package]
name = "furb-host"
version.workspace = true
edition = "2024"
rust-version = "1.95"
description = "The host of furb: each life on a thread of its own, behind a handle that any thread holds."
license = "AGPL-3.0-only"
repository = "https://github.com/uael/furb"

[lints]
workspace = true

[dependencies]
# The engine, the ears of the World and the provider of models, through the public API of the crate alone.
furb = { path = "..", version = "0.4.2" }
# The runtime of the thread of each life, the channels between that thread and the handles of the life, and the
# socket or the pipe of the protocol, and the process of each skill that a life plays.
tokio = { version = "1", features = ["rt", "sync", "macros", "net", "io-util", "time", "fs", "process"] }
# The frames of the protocol, one line of JSON each, with a bound on the size of a line.
tokio-util = { version = "0.7", features = ["codec"] }
# The stream of the events of a life, and the sink of the frames of a peer.
futures = "0.3"
# A fact, an act and the reply of a query as JSON, as the record keeps a value.
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# The JSON Schema of the protocol, from which bind/typescript/src/protocol.ts is made.
schemars = "1"
thiserror = "2"
# The WebSocket transport.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
# The local API of Tailscale, an HTTP server on a socket of the machine, and the token that its app for
# macOS asks, and the address of a peer in its query.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
base64 = "0.22"
form_urlencoded = "1"
# The token of the door of the windows, drawn by the system.
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
# The user of the daemon and of a peer of its socket.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The access list of the pipe, which only the user of the daemon reaches, and the login of that user.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }

[[test]]
# The test of a rebirth runs in a process of its own, with no harness.
name = "rebirth"
harness = false
