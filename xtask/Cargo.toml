[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
description = "The tasks of a developer of furb, as `cargo xtask`."
license = "AGPL-3.0-only"
publish = false

[lints]
workspace = true

[dependencies]
clap = { version = "4.6", features = ["derive", "env", "string"] }
fancy-regex = "0.20"
notify = "8"
# The task deepswe: the manifests of the registry of an image and the files of a task, the tar of
# each layer of an image, gzipped or not, and the toml of a task.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
flate2 = "1"
tar = "0.4"
toml = "1"
# The bound of each step of the rig, which waits on its child with no poll.
wait-timeout = "0.2"
thiserror = "2"
