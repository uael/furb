# The bar of the Rust of furb, beside the lints of Cargo.toml, which the skill rust says.
too-many-lines-threshold = 60
too-many-arguments-threshold = 4
allow-unwrap-in-tests = true
allow-expect-in-tests = true
# A panic is how a test fails, so a test indexes and panics as it reads.
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
disallowed-methods = [
  { path = "std::thread::sleep", reason = "an ear awaits; a poll with sleep hides a hang" },
  { path = "futures::executor::block_on", reason = "never block the life or the reactor" },
  { path = "tokio::runtime::Runtime::block_on", reason = "never block the life or the reactor" },
  { path = "tokio::runtime::Handle::block_on", reason = "never block the life or the reactor" },
  { path = "tokio::task::LocalSet::block_on", reason = "never block the life or the reactor" },
  { path = "std::thread::park_timeout", reason = "an ear awaits; a park on a timer hides a hang" },
  { path = "std::process::Child::try_wait", reason = "await tokio::process::Child::wait under a timeout" },
]
absolute-paths-max-segments = 2
# The names of products that a doc comment writes as they are, beside the names that clippy knows.
doc-valid-idents = ["..", "OpenTUI", "FFmpeg", "MinGW", "DeepSWE"]
# One owner for each state: a part that seems to share one sends a message, moves the value or
# borrows it, as rule 9 of the skill rust says.
disallowed-types = [
  { path = "std::cell::RefCell", reason = "give the state one owner, as rule 9 of the skill rust says" },
]
