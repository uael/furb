[package]
name = "furb-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "furb, the desktop app: a window that runs a life of furb on the host of the TUI, with a UI of the web."
license = "AGPL-3.0-only"
repository = "https://github.com/uael/furb"
publish = false

[[bin]]
name = "furb-gui"
path = "src/main.rs"

[dependencies]
# The window and the web view, which show the UI of gui/src, and give it the address of the host of the life.
tauri = { version = "2", features = [] }
# The native dialog that picks a project or a record.
tauri-plugin-dialog = "2"
serde_json = "1"

# The private property of WKWebView that names the process of its web content, which a check prints.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# A workspace of its own: Tauri needs the web view of the system, which the gates of the crate do not install.
[workspace]

# The bar of the Rust of furb, as in the Cargo.toml of the crate.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
expect_used = "warn"
let_underscore_must_use = "deny"
let_underscore_untyped = "warn"
map_err_ignore = "warn"
str_to_string = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
needless_pass_by_value = "warn"
unused_async = "warn"
too_many_lines = "warn"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "warn"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[lints]
workspace = true

# Each dependency optimized, so the window runs as fast as in a release while the app builds quickly.
[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false
