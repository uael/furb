# A tree keeps the incremental state of its crates in its own target, so a change of one file of a crate rebuilds it in
# seconds, whatever a config above the clone says. A job of CI builds once and turns it off with CARGO_INCREMENTAL in
# .github/actions/setup/action.yml.
[build]
incremental = true
# A warning fails each build, here and in CI, which reads this file too: a warning that only CI denied, as one of the
# manifest of a crate, passed each local gate and failed every job of the gates.
warnings = "deny"

# The tasks of a developer: `cargo xtask` lists them.
[alias]
xtask = "run --quiet --package xtask --"

# The build script of opentui-sys links a native library of OpenTUI that stands already, and fails when none stands.
# crates/window/build.rs makes that library with Zig and says its link, and cargo cannot run it before the script of
# another package. So that script is turned off, by its `links` key, on each system that furb ships for, and on the gnu
# target of Windows, which `cargo xtask targets` lints.
[target.aarch64-apple-darwin.opentui]
[target.x86_64-apple-darwin.opentui]
[target.x86_64-unknown-linux-gnu.opentui]
[target.aarch64-unknown-linux-gnu.opentui]
[target.x86_64-pc-windows-msvc.opentui]
[target.x86_64-pc-windows-gnu.opentui]
