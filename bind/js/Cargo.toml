[package]
name = "furb-js"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "furb for javascript: one life of the engine, in the sandbox, with a World you write in javascript."
license = "AGPL-3.0-only"
repository = "https://github.com/uael/furb"

[lib]
name = "furb_js"
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
default = ["gate"]
# The gate of the crate, which is ty. See the root manifest.
gate = ["furb/gate"]

[dependencies]
furb = { path = "../..", default-features = false }
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
