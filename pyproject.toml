[project]
name = "furb"
version = "0.1.0"
description = "The core of an AI harness, in one python file."
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Abel Lucas", email = "uaelucas@gmail.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-ai-slim>=2.27.1",
    "python-minifier>=3.3.0",
]

[project.scripts]
furb = "furb.cli:main"

[project.urls]
Source = "https://github.com/uael/furb"
Issues = "https://github.com/uael/furb/issues"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "pre-commit>=4.6.2",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "pytest-timeout>=2.4.0",
  "pytest-xdist>=3.8.0",
  "python-minifier>=3.2.0",
  "ruff>=0.16.2",
  "tiktoken>=0.13.0",
  # The one ty the gate of this interpreter runs, which is the commit the crate's gate is built from; see Cargo.toml.
  "ty==0.0.82",
  "furb-monty",
]

[tool.uv.workspace]
members = ["bind/python"]

[tool.uv.sources]
furb-monty = { workspace = true }

[tool.ruff]
line-length = 120
indent-width = 2
target-version = "py314"
src = ["src", "test", "bind/python"]

[tool.ruff.lint]
select = [
  "A", "ANN", "ARG", "B", "C4", "E", "EM", "ERA", "F", "FBT", "I", "N", "PERF", "PGH", "PL", "PT", "PTH", "RET", "RUF",
  "S", "SIM", "T20", "TID", "TRY", "UP", "W",
]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# The suite pins the contract's own literals, drives doubles that answer in one sentence where they stand, and
# names its tests by the sentence they carry.
"test/**" = ["PLR2004", "EM101", "EM102", "TRY003", "FBT001", "FBT003", "PT018", "ARG002", "RUF012", "PLR0911", "PLR0912", "A002", "E501"]
# The plain form has one arm for each kind of value, on both sides of the boundary, and a life opens on everything
# it takes: the engine, the sheet, the names, the record, the host and the ears.
"src/preamble.py" = ["PLR0911", "PLR0912", "PLR0913", "PLR0917"]
"bind/python/furb_monty/engine.py" = ["PLR0911", "PLR0912"]
# The stub of the extension names the exception as the contract names one, and reads a union as the engine writes it.
"bind/python/furb_monty/_monty.pyi" = ["N818", "RUF036"]
# The surface speaks the engine's own vocabulary: its verbs shadow builtins on purpose, take the parameters the
# contract names, and its exceptions are named as the contract names them.
"src/furb/engine.pyi" = ["N818", "A001", "A002", "PLR0913", "B008", "FBT001", "FBT002", "ARG001", "ARG002", "E501", "PLR0904"]
"src/furb/engine.py" = ["S307", "TID251", "FBT003", "N818", "A001", "A002", "PLR0913", "B008", "FBT001", "FBT002", "ARG001", "ARG002", "ANN", "PLR0904", "EM101", "EM102", "TRY003", "PLR0917", "PLR0911", "PLR0912", "PLR0915", "PLR2004", "SIM105", "C901", "SLF001"]

[tool.ruff.lint.pycodestyle]
max-line-length = 160

[tool.ruff.lint.isort]
split-on-trailing-comma = false
known-first-party = ["furb", "furb_monty", "conftest"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Any defeats static typing; use a concrete type, a Protocol, or a TypeVar."
"typing.cast".msg = "cast asserts what the checker cannot prove; narrow with isinstance or fix the type."
"typing.no_type_check".msg = "Opting out of type checking is not permitted."
"typing.TYPE_CHECKING".msg = "Import at runtime so annotations stay verifiable."

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ty.src]
include = ["src", "test", "script", "bind/python"]

# The engine holds the loop's state in the closure of boot, and ty does not narrow a captured name; what it reads
# of an act, a task or a standing it reads after the check the sentence beside it makes.
[[tool.ty.overrides]]
include = ["src/furb/engine.py"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
unsupported-operator = "ignore"
invalid-argument-type = "ignore"

# The engine of monty reads the engine of this interpreter as the module the switch keeps, whose names ty does not
# see through a module object, and the extension it stands on is built and not read.
[[tool.ty.overrides]]
include = ["bind/python/furb_monty/engine.py"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
unresolved-import = "ignore"

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["test"]
pythonpath = [".", "test"]
# The suite runs on every core: a test opens a life of its own and leaves nothing behind, so the tests are independent.
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib", "-n", "auto", "--cov=furb", "--cov=furb_monty", "--cov-report=term-missing", "--cov-fail-under=100"]
xfail_strict = true
timeout = 30
timeout_method = "thread"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.coverage.report]
# The suite runs every line of engine.py. The lines it cannot reach are the bodies of send, ask, act and drive
# before a life is living: boot binds the four to itself before anything can call them, so the stubs stand only
# to name the error of a call outside a life.
fail_under = 100
exclude_also = ['raise RuntimeError\("no life"\)']
