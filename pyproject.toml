[project]
name = "furb"
# uv_build takes no version from another file, so this is the version of the workspace of Cargo.toml, written again.
version = "0.1.0"
description = "The core of an AI harness, in one python file."
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Abel Lucas", email = "uaelucas@gmail.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
    # The Kernel gates a word through the gate of the crate, so the package stands on the extension, at its own
    # version: both carry the engine, and a release is the two together.
    "furb-monty==0.1.0",
    # The command furb is a program of rust, which the wheel of furb-cli puts on the PATH of the environment.
    "furb-cli==0.1.0",
]

[project.urls]
Source = "https://github.com/uael/furb"
Issues = "https://github.com/uael/furb/issues"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "pre-commit>=4.6.2",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "pytest-timeout>=2.4.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.16.2",
  "tiktoken>=0.13.0",
  # The type checker of the repository, which reads the package and the suite; the gate of a word is the crate's.
  "ty>=0.0.82",
]

[tool.uv.workspace]
members = ["bind/python", "cli"]

[tool.uv]
# An environment of development builds the crate in the dev profile, which optimizes each dependency and builds the
# crates of the workspace quickly. A wheel built for a release takes the release profile of maturin.
config-settings-package = { furb-monty = { build-args = "--profile=dev" }, furb-cli = { build-args = "--profile=dev" } }

[tool.uv.sources]
furb-monty = { workspace = true }
furb-cli = { workspace = true }

[tool.ruff]
line-length = 120
indent-width = 2
target-version = "py314"
src = ["src", "test", "bind/python"]
# A word of an extension of the project runs in a chain, on the names of the engine, and keeps its own form.
extend-exclude = [".furb"]

[tool.ruff.lint]
select = [
  "A", "ANN", "ARG", "B", "C4", "E", "EM", "ERA", "F", "FBT", "I", "N", "PERF", "PGH", "PL", "PT", "PTH", "RET", "RUF",
  "S", "SIM", "T20", "TID", "TRY", "UP", "W",
]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# The suite pins the contract's own literals, drives doubles that answer in one sentence where they stand, and
# names its tests by the sentence they carry.
"{test,extensions/*/test}/**" = ["PLR2004", "EM101", "TRY003", "FBT003", "PT018", "PLR0912", "A002", "E501"]
# The surface speaks the engine's own vocabulary: its parameters shadow builtins on purpose, its exceptions are
# named as the contract names them, and each sentence of the contract stands on one line of its own.
"src/furb/engine.pyi" = ["N818", "A002", "E501"]
"extensions/*/*.pyi" = ["E501"]
# An example of the framework starts itself again as a process of its own, to show a life that resumes after its
# process ends.
"docs/examples/**/*.py" = ["T201"]
# A life speaks the vocabulary of the engine, whose ids shadow a builtin, and open opens a life as open opens a file.
"src/furb/life.py" = ["A001", "A002", "PLR0913"]
"src/furb/__init__.py" = ["A004"]
# A word speaks the vocabulary of the engine, which a model reads: the ear of an act takes its id, untyped, as the
# ears of the engine do.
"extensions/*/*.py" = ["A002", "ANN001"]
# boot binds the names of its life, the bus and the reads of its tables, as globals of the module.
"src/furb/engine.py" = ["PLW0603", "S307", "TID251", "FBT003", "N818", "A001", "A002", "PLR0913", "FBT001", "FBT002", "ARG001", "ANN", "EM101", "EM102", "TRY003", "PLR0917", "PLR0912", "PLR0915", "SIM105"]

[tool.ruff.lint.pycodestyle]
max-line-length = 160

[tool.ruff.lint.isort]
split-on-trailing-comma = false
known-first-party = ["furb", "furb_monty", "conftest", "extensions"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Any defeats static typing; use a concrete type, a Protocol, or a TypeVar."
"typing.cast".msg = "cast asserts what the checker cannot prove; narrow with isinstance or fix the type."
"typing.no_type_check".msg = "Opting out of type checking is not permitted."
"typing.TYPE_CHECKING".msg = "Import at runtime so annotations stay verifiable."

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ty.src]
include = ["src", "test", "script", "bind/python", "extensions"]

# The suite of an extension imports the harness of the engine as conftest, as pytest does from its pythonpath, and
# its own helpers from extensions.conftest. The package furb_monty is read from its source and the stub of its
# extension, so the check needs no build of the crate.
[tool.ty.environment]
extra-paths = ["test", "bind/python"]

# The engine holds the loop's state in the closure of boot, and ty does not narrow a captured name; what it reads
# of an act, a task or a standing it reads after the check the sentence beside it makes. boot binds the names of its
# life as globals of the module, which no statement at the top binds.
[[tool.ty.overrides]]
include = ["src/furb/engine.py"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
unsupported-operator = "ignore"
invalid-argument-type = "ignore"
unresolved-global = "ignore"

# The engine of monty reads the engine of this interpreter as the module the switch keeps, whose names ty does not
# see through a module object, and the extension it stands on is built and not read.
[[tool.ty.overrides]]
include = ["bind/python/furb_monty/engine.py"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
unresolved-import = "ignore"

[tool.pytest.ini_options]
testpaths = ["test", "extensions"]
pythonpath = [".", "test"]
# The suite runs on every core: a test opens a life of its own and leaves nothing behind, so the tests are independent.
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib", "-n", "auto", "--cov=furb", "--cov=furb_monty", "--cov-report=term-missing"]
xfail_strict = true
timeout = 30
timeout_method = "thread"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.coverage.run]
# The examples run as processes, as a user runs them, and each one counts.
patch = ["subprocess"]

[tool.coverage.report]
# The suite runs every line of engine.py. A run counts no file that FURB_UNCOUNTED names: the suite on Windows names
# src/furb/life.py, since the tests of the life as a program run on POSIX alone.
fail_under = 100
omit = ["${FURB_UNCOUNTED-}"]
