name: release

# release-please keeps a pull request of the next release open on main: the one version of every package in each
# manifest that names it, and CHANGELOG.md, from the commits since the last release, in the order of the manifest
# mode of release-please-config.json. A merge of that pull request makes the tag vX.Y.Z and its release on GitHub, and
# this workflow then starts publish.yml on that tag, which publishes the version to npm and PyPI, and to crates.io
# once no crate of furb stands on git. A tag that the token of a workflow pushes starts no workflow, but a start by
# hand does, so the start is that of publish.yml. A merge of any other pull request publishes nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # The pull request of release-please changes the version in each manifest, and in Cargo.lock and uv.lock, and
      # bun.lock follows here, since it is no file that release-please reads. A pull request that the token of a
      # workflow opens starts no gates, so the job starts them by hand on its branch, and their checks stand on its
      # head. The branch is read in the shell, since a template that reads an empty output fails the job even where
      # the step does not run.
      - id: pr
        if: steps.release.outputs.prs_created == 'true'
        env:
          PR: ${{ steps.release.outputs.pr }}
        run: echo "branch=$(printf '%s' "$PR" | jq -r '.headBranchName // empty')" >> "$GITHUB_OUTPUT"
      - if: steps.pr.outputs.branch != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.branch }}
      - if: steps.pr.outputs.branch != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - if: steps.pr.outputs.branch != ''
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          bun install --lockfile-only
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qm "Write the version of the release in bun.lock" -- bun.lock
            git push origin "HEAD:$BRANCH"
          fi
          gh workflow run gates.yml --ref "$BRANCH"
      - if: steps.release.outputs.release_created == 'true' && steps.release.outputs.tag_name != ''
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
