name: typescript

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bindings-and-tui:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_INCREMENTAL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      # The key of the cache holds the files that tell cargo what to build, because the action does not read them.
      # Only main saves the cache, and a pull request reads the cache of main.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          cache-key: ${{ hashFiles('.github/workflows/typescript.yml', 'bind/typescript/build.ts') }}
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.12.17"
      - run: uv sync --locked
      - run: bun install --frozen-lockfile
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --features typescript -- -D warnings
      - run: cargo test --features typescript
      - run: bun run build
      - run: bun run docs
      - run: git diff --exit-code -- bind/typescript/index.cjs bind/typescript/index.d.cts
      - run: git diff --exit-code -- tui/README.md
      - run: bun run check
      - run: bun run lint
      - run: bun test bind/typescript/test tui/test
