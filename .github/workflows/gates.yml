name: gates
run-name: ${{ inputs.lane && format('the gates of {0} at {1}', inputs.lane, inputs.head) || github.event.pull_request.title || github.event.head_commit.message || 'gates' }}

on:
  workflow_dispatch:
    inputs:
      base:
        description: >-
          The commit that the head is compared with, as the merge base of a lane and w/converge: the run takes the jobs
          that the paths between them need, as a pull request does. Empty, the run takes every job.
        default: ""
      head:
        description: >-
          The commit that the run proves, when it is not the commit of its ref: the oracle of a lane starts the run of
          the head of the lane on w/converge, whose caches of rust the run reads and saves, where a run on the branch of
          a lane reads only the caches of that branch and of main.
        default: ""
      lane:
        description: The branch of the lane whose head the run proves, which names the run and its group.
        default: ""
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Each night every job runs on main, whatever changed: it proves each system on the sum of the day, and it saves a
  # fresh cache of rust for each job.
  schedule:
    - cron: "30 2 * * *"

# One run of the gates for one branch, or for one lane: a push that follows another ends the run before it, and so does
# a new head of a lane. On main, on the pull request of w/converge (the head_ref of a pull request is its branch) and on
# a run of w/converge that proves no lane, it ends only a run that waits, since a group holds one run that waits at
# most, and the run in progress goes to its end. Only a run of main that passes saves the caches of rust, and a run
# that a push ends during its save leaves a key that no later run can save: a cancel on main made the bindings on
# Windows build their dependencies again on each run, in 12 minutes. A run takes 30 to 40 minutes and the aggregator
# pushes w/converge every 15 to 25, so a cancel at each push left no head of it with a verdict.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.lane || github.ref }}
  cancel-in-progress: ${{ inputs.lane != '' || !(github.ref == 'refs/heads/main' || github.ref == 'refs/heads/w/converge' || github.head_ref == 'w/converge') }}

permissions:
  contents: read
  # The step clear of each job deletes the old cache of rust of that job, on main.
  actions: write

env:
  # The one uv every gate installs, so a run of today and a run of next month read the lock the same way.
  UV_VERSION: "0.12.17"

jobs:
  scope:
    # A runner of macOS waits in a queue of its own, for 10 minutes in the median. The jobs on Linux always run and hold
    # the whole proof of the logic; the jobs on macOS and on Windows prove the system alone, so a pull request and a
    # push to main run them only when a path that they change can behave in another way there, which script/scope.py
    # says. A run by hand given a base runs what the paths between that base and its head need, and says the base as
    # base=<sha>, which the oracle of a lane reads. A run by hand with no base, and the run of each night, run every job.
    # The commit of a pull request is the merge of its branch into the base, whose first parent is the base, so two
    # commits of history hold the change. A push to main holds the commits after the head before it, which the step
    # fetches alone, since the diff of two trees needs no history between them. A push with no head before it, or one
    # whose head before it is gone, runs every job. The whole history took 4 minutes to fetch, and the other jobs fetch
    # one commit in under 40 seconds.
    # A job that a push to main skips saves no cache of rust, and the cache that it saved before stays valid: its key
    # holds each manifest and the lock of cargo, and a change of them runs every job.
    # A render of the gallery changes only files that no gate reads, so it runs this job and the job of the gates, as
    # script/scope.py holds.
    name: the scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      suite_os: ${{ steps.scope.outputs.suite_os }}
      ts_os: ${{ steps.scope.outputs.ts_os }}
      crate_os: ${{ steps.scope.outputs.crate_os }}
      build_os: ${{ steps.scope.outputs.build_os }}
      code: ${{ steps.scope.outputs.code }}
      hooks: ${{ steps.scope.outputs.hooks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head }}
          fetch-depth: 2
          persist-credentials: false
      - id: scope
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ inputs.base }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD | python3 script/scope.py
          elif [ -n "$BASE" ]; then
            git fetch -q --depth=1 --no-tags origin "$BASE" && base=$(git rev-parse FETCH_HEAD) || exit 1
            echo "base=$base"
            git diff --name-only "$base" HEAD | python3 script/scope.py
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ -n "${BEFORE//0/}" ] \
            && git fetch -q --depth=1 --no-tags origin "$BEFORE" && changed=$(git diff --name-only "$BEFORE" HEAD); then
            printf '%s\n' "$changed" | python3 script/scope.py
          else
            python3 script/scope.py --all
          fi | tee -a "$GITHUB_OUTPUT"

  hooks:
    # The hooks check what a change holds with no build: the suite, the clippy and the tests of the crate and the lint
    # of TypeScript are jobs of their own below, on the build of each system, and no hook runs them a second time here.
    # The rust of the toolchain formats the crates, and no cache serves a gate that compiles nothing.
    name: the hooks
    needs: scope
    if: needs.scope.outputs.hooks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head }}
          persist-credentials: false
      # The hooks check the python with its tools alone, and read furb_monty from its source.
      - uses: ./.github/actions/setup
        with:
          python: tools
          rust: tools
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: pytest,biome,clippy,cargo-test
          UV_NO_SYNC: "1"

  system:
    # Each system builds once, and its jobs run what it built: the workflow system holds them, called once for each
    # system that the change needs.
    name: the jobs on ${{ matrix.os }}
    needs: scope
    if: needs.scope.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.build_os) }}
    uses: ./.github/workflows/system.yml
    with:
      os: ${{ matrix.os }}
      suite: ${{ contains(fromJSON(needs.scope.outputs.suite_os), matrix.os) }}
      crate: ${{ contains(fromJSON(needs.scope.outputs.crate_os), matrix.os) }}
      typescript: ${{ contains(fromJSON(needs.scope.outputs.ts_os), matrix.os) }}
      head: ${{ inputs.head }}

  bench:
    # The budget of the speed of the TUI holds on Linux, on a machine that runs no other work while it measures: the
    # first frame of a life of 160000 facts, the frames of the renderer at 60 each second while it scrolls and streams,
    # and the cost of a new fact against that in a life of a tenth of the size, each against a measure of the same
    # machine, since one runner of ubuntu-latest is half as fast as another. It builds in the release profile, a target
    # of its own that the build of Linux does not hold, beside that build, so neither job waits for the other.
    name: the speed of the TUI on ubuntu-latest
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head }}
          persist-credentials: false
      # The job keeps a cache of its own, since it builds in the release profile, which the cache of the build on Linux
      # does not hold.
      - uses: ./.github/actions/setup
        with:
          python: none
          hashed: bind/typescript/build.ts
      - run: |
          echo "CARGO_BUILD_TARGET=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      # The bench measures the speed that a user gets, so it builds the crate in the release profile, and refuses a
      # build in the dev profile, whose crates of the workspace run with no optimization.
      - run: bun run build --release
      # The measures of the run stay as an artifact, so an audit reads the exact numbers of each run and not the rounded
      # lines of its log, and a run that goes over a budget keeps them too.
      - env:
          FURB_BENCH_JSON: ${{ runner.temp }}/measures/bench.jsonl
        run: |
          mkdir -p "$RUNNER_TEMP/measures"
          bun run bench 2>&1 | tee "$RUNNER_TEMP/measures/bench.log"
      - uses: ./.github/actions/clear
      - if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/measures"
          printf '{"fixture_bytes":%s,"fixture_lines":%s}\n' "$(wc -c < tui/fixtures/conductor.jsonl)" \
            "$(wc -l < tui/fixtures/conductor.jsonl)" > "$RUNNER_TEMP/measures/fixture.json"
      - if: always()
        uses: ./.github/actions/measures
        with:
          name: bench

  gates:
    # The one check that reports on each pull request and stands for all the gates, so that a ruleset of main requires
    # this check alone. A job that its if skips reports under its raw name, as the suite does for each system, which no
    # ruleset can require, and a render of the gallery runs the scope alone. This job runs always. It fails when a job
    # that it needs failed or was cancelled, and it passes when each of them succeeded or was skipped, so a build that
    # failed fails it though the jobs after that build report skipped.
    name: the gates
    needs: [scope, hooks, system, bench]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null
