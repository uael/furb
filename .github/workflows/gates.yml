name: gates

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Each night every job runs on main, whatever changed: it proves each system on the sum of the day, and it saves a
  # fresh cache of rust for each job.
  schedule:
    - cron: "30 2 * * *"

# One run of the gates for one branch: a push that follows another ends the run before it. On main, and on the pull
# request of w/converge (the head_ref of a pull request is its branch), it ends only a run that waits, since a group
# holds one run that waits at most, and the run in progress goes to its end. Only a run of main that passes saves the
# caches of rust, and a run that a push ends during its save leaves a key that no later run can save: a cancel on main
# made the bindings on Windows build their dependencies again on each run, in 12 minutes. A run takes 30 to 40 minutes
# and the aggregator pushes w/converge every 15 to 25, so a cancel at each push left no head of it with a verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !(github.ref == 'refs/heads/main' || github.head_ref == 'w/converge') }}

permissions:
  contents: read
  # The step clear of each job deletes the old cache of rust of that job, on main.
  actions: write

env:
  # The one uv every gate installs, so a run of today and a run of next month read the lock the same way.
  UV_VERSION: "0.12.17"

jobs:
  scope:
    # A runner of macOS waits in a queue of its own, for 10 minutes in the median. The jobs on Linux always run and hold
    # the whole proof of the logic; the jobs on macOS and on Windows prove the system alone, so a pull request and a
    # push to main run them only when a path that they change can behave in another way there, which script/scope.py
    # says. A run by hand, and the run of each night, run every job.
    # The commit of a pull request is the merge of its branch into the base, whose first parent is the base, so two
    # commits of history hold the change. A push to main holds the commits after the head before it, which the step
    # fetches alone, since the diff of two trees needs no history between them. A push with no head before it, or one
    # whose head before it is gone, runs every job. The whole history took 4 minutes to fetch, and the other jobs fetch
    # one commit in under 40 seconds.
    # A job that a push to main skips saves no cache of rust, and the cache that it saved before stays valid: its key
    # holds each manifest and the lock of cargo, and a change of them runs every job.
    # A render of the gallery changes only files that no gate reads, so it runs this job and the job of the gates, as
    # script/scope.py holds.
    name: the scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      suite_os: ${{ steps.scope.outputs.suite_os }}
      ts_os: ${{ steps.scope.outputs.ts_os }}
      crate: ${{ steps.scope.outputs.crate }}
      code: ${{ steps.scope.outputs.code }}
      hooks: ${{ steps.scope.outputs.hooks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: scope
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD | python3 script/scope.py
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ -n "${BEFORE//0/}" ] \
            && git fetch -q --depth=1 --no-tags origin "$BEFORE" && changed=$(git diff --name-only "$BEFORE" HEAD); then
            printf '%s\n' "$changed" | python3 script/scope.py
          else
            python3 script/scope.py --all
          fi | tee -a "$GITHUB_OUTPUT"

  hooks:
    name: the hooks
    needs: scope
    if: needs.scope.outputs.hooks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The hooks check the python with its tools alone, and read furb_monty from its source.
      - uses: ./.github/actions/setup
        with:
          python: tools
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # The suite is a gate of its own below, on three systems, and no hook runs it a second time here.
      - run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: pytest
          UV_NO_SYNC: "1"
      - uses: ./.github/actions/clear

  suite:
    # The engine speaks to a machine through the World, and a machine answers as itself: the suite runs on each,
    # and on both engines, the one of the interpreter and the one in the sandbox of monty.
    name: the suite on ${{ matrix.os }}
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.suite_os) }}
    # On Windows the commands of the tests run in the sh of Git for Windows, which the bash of Git puts on PATH.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The test of the walls counts tokens with a vocabulary that tiktoken downloads at its first use. A download that
      # stalls past the 30 seconds of a test ends the worker of the suite, which reports a crash and no cause, so the
      # vocabulary comes here, where a stall is bounded, and the suite reads it from disk.
      - run: echo "TIKTOKEN_CACHE_DIR=$RUNNER_TEMP/tiktoken" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tiktoken
          key: tiktoken-o200k_base
      - run: |
          for try in 1 2 3; do
            uv run python -c "import socket, tiktoken; socket.setdefaulttimeout(60); tiktoken.get_encoding('o200k_base')" && exit 0
          done
          exit 1
        timeout-minutes: 5
        env:
          UV_NO_SYNC: "1"
      # The run syncs nothing, so it does not build the program furb that the setup leaves out.
      - run: uv run pytest -q --durations=25
        env:
          UV_NO_SYNC: "1"
          FURB_UNCOUNTED: ${{ runner.os == 'Windows' && '*/src/furb/life.py' || '' }}
      # What the walls of the engine and of the doctrine leave, as the script of the tokens says it, kept as an artifact.
      - if: always() && runner.os == 'Linux'
        env:
          UV_NO_SYNC: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/measures"
          uv run python script/tokens.py > "$RUNNER_TEMP/measures/tokens.txt" 2>&1 || echo "exit $?" >> "$RUNNER_TEMP/measures/tokens.txt"
      - if: always() && runner.os == 'Linux'
        uses: ./.github/actions/measures
        with:
          name: tokens
      - uses: ./.github/actions/clear

  crate:
    # The hooks run the gates of the crate and of the command line on Linux. Windows and macOS have a job of their own,
    # since a path, a line end and a process are of another form there. It builds the crate with the feature of the
    # bindings of TypeScript too, so it runs their clippy and their tests. On macOS it is a job of its own beside the
    # bindings, which build the crate a third time for the package, on a runner of three cores: one job that held
    # the clippy, the tests and the package took its three builds of the crate one after the other. Windows builds
    # the command line too, whose processes take another form there.
    name: the crate on ${{ matrix.os }}
    needs: scope
    if: needs.scope.outputs.crate == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            crates: --workspace --features furb/typescript
          - os: macos-latest
            crates: --features typescript
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: none
          key: typescript
      - run: cargo clippy --all-targets ${{ matrix.crates }} -- -D warnings
      - run: cargo test ${{ matrix.crates }}
      # The kill matrix of the daemon ends it with the signals of Unix, so it runs on macOS here, and on Linux in the
      # hooks, whose cargo test holds the whole workspace.
      - if: runner.os == 'macOS'
        run: cargo test -p furb-cli --test kills
      - uses: ./.github/actions/clear
        with:
          key: typescript

  typescript:
    name: the bindings and the TUI on ${{ matrix.os }}
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    # A change of the lock, of this file or of the script of the build makes every system build each crate from
    # nothing, and main saves the cache only from a job that passes. A limit shorter than that build fails every later
    # run too, since none finds a cache.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.ts_os) }}
    # One shell on every system. On Windows it is the bash of Git for Windows, which puts on PATH the sh and the tools
    # that the commands of the tests run.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # On Windows the job builds the package alone, so its cache holds other artifacts than on the other systems.
      - uses: ./.github/actions/setup
        with:
          python: none
          key: ${{ runner.os == 'Windows' && 'package' || '' }}
          hashed: bind/typescript/build.ts
      # napi builds for the triple of the machine, in a folder of its own: cargo builds for it too, so the tests and
      # the package share every dependency.
      - run: |
          echo "CARGO_BUILD_TARGET=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_ENV"
      # The bun:ffi of bun 1.3 builds its native callbacks with TinyCC in pages of the heap of Windows, which lose
      # their right to run code while the process lives, and a call into OpenTUI then crashes. From bun 1.4 on, the
      # engine builds them.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      # The job of the crate runs the clippy and the tests of the crate with this feature on Windows and on macOS, and
      # the hooks on Linux.
      - run: bun run build
      - run: bun run docs
      - run: git diff --exit-code -- bind/typescript/index.d.cts tui/README.md
      - run: bun run check
      - run: bun run lint
      - run: bun run test
      - uses: ./.github/actions/clear
        with:
          key: ${{ runner.os == 'Windows' && 'package' || '' }}

  bench:
    # The budget of the speed of the TUI holds on Linux, on a machine that runs no other work while it measures: the
    # first frame of a life of 160000 facts, the frames of the renderer at 60 each second while it scrolls and streams,
    # and the cost of a new fact against that in a life of a tenth of the size, each against a measure of the same
    # machine, since one runner of ubuntu-latest is half as fast as another. It runs beside the bindings on Linux,
    # whose tests take most of their time, so neither job waits for the other. The clippy and the tests of the crate
    # with the feature of the bindings run in the hooks, and not here a second time.
    name: the speed of the TUI on ubuntu-latest
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The job builds from the dependencies that the bindings on Linux built and saved.
      - uses: ./.github/actions/setup
        with:
          python: none
          shared: typescript
          hashed: bind/typescript/build.ts
      - run: |
          echo "CARGO_BUILD_TARGET=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run build
      # The measures of the run stay as an artifact, so an audit reads the exact numbers of each run and not the rounded
      # lines of its log, and a run that goes over a budget keeps them too.
      - env:
          FURB_BENCH_JSON: ${{ runner.temp }}/measures/bench.jsonl
        run: |
          mkdir -p "$RUNNER_TEMP/measures"
          bun run bench 2>&1 | tee "$RUNNER_TEMP/measures/bench.log"
      - if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/measures"
          printf '{"fixture_bytes":%s,"fixture_lines":%s}\n' "$(wc -c < tui/fixtures/conductor.jsonl)" \
            "$(wc -l < tui/fixtures/conductor.jsonl)" > "$RUNNER_TEMP/measures/fixture.json"
      - if: always()
        uses: ./.github/actions/measures
        with:
          name: bench

  gates:
    # The one check that reports on each pull request and stands for all the gates, so that a ruleset of main requires
    # this check alone. A job that its if skips reports under its raw name, as the suite does for each system, which no
    # ruleset can require, and a render of the gallery runs the scope alone. This job runs always. It fails when a job
    # that it needs failed or was cancelled, and it passes when each of them succeeded or was skipped.
    name: the gates
    needs: [scope, hooks, suite, crate, typescript, bench]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null
