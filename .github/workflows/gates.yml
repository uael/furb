name: gates

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One run of the gates for one branch: a push that follows another ends the run before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The one uv every gate installs, so a run of today and a run of next month read the lock the same way.
  UV_VERSION: "0.12.17"
  # A gate builds once and runs no debugger, so a build writes no debug information and keeps no incremental state.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_DEV_INCREMENTAL: "false"

jobs:
  hooks:
    name: the hooks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The hooks check the python with its tools alone, and read furb_monty from its source.
      - uses: ./.github/actions/setup
        with:
          python: tools
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # The suite is a gate of its own below, on two systems, and no hook runs it a second time here.
      - run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: pytest
          UV_NO_SYNC: "1"

  suite:
    # The engine speaks to a machine through the World, and a machine answers as itself: the suite runs on both,
    # and on both engines, the one of the interpreter and the one in the sandbox of monty.
    name: the suite on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: uv run pytest -q

  typescript:
    name: the bindings and the TUI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A change of the lock or of this file makes every system build each crate from nothing, and main saves the cache
    # only from a job that passes. A limit shorter than that build fails every later run too, since none finds a cache.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # One shell on every system. On Windows it is the bash of Git for Windows, which puts on PATH the sh and the tools
    # that the commands of the tests run.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: none
      # napi builds for the triple of the machine, in a folder of its own: cargo builds for it too, so the tests and
      # the package share every dependency.
      - run: |
          echo "CARGO_BUILD_TARGET=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_ENV"
      # The bun:ffi of bun 1.3 builds its native callbacks with TinyCC in pages of the heap of Windows, which lose
      # their right to run code while the process lives, and a call into OpenTUI then crashes. From bun 1.4 on, the
      # engine builds them.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      # The hooks check the format of the crate, and the features do not change it.
      - run: cargo clippy --all-targets --features typescript -- -D warnings
      - run: cargo test --features typescript
      - run: bun run build
      - run: bun run docs
      - run: git diff --exit-code -- bind/typescript/index.d.cts tui/README.md
      - run: bun run check
      - run: bun run lint
      - run: bun run test
