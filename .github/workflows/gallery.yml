name: gallery

# The gallery of the TUI, docs/screenshots and docs/furb.gif, drawn from the head of w/converge, so the owner follows
# the screens of the builds and the QA judges the same pictures of the same head. The run renders both as
# `bun run screenshots` and `bun run animation` do on a machine, with the watcher of memory beside them, and pushes the
# head with the render on top to one fixed branch, w/gallery. One pull request of w/gallery into w/converge stands, and
# each later run updates its branch and its body in place, with the head that it shows. The diff of that pull request
# is what the screens of the head changed against the gallery that the head holds.
# It renders at most once an hour, and never on a push, so it takes no runner from the gates: the desk of the conductor
# dispatches it on w/converge once an hour on a new head, and a schedule each hour renders the head only when it
# changed since the last render. test/outside/test_gallery_workflow.py holds this rule.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 * * * *"

# A request while a render runs waits for it, and a newer request replaces the one that waits: a render that a newer
# request ended would leave no gallery at all. The group is fixed, since a schedule runs on main and a dispatch on
# w/converge, and both render the same branch.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The head of w/converge to render, and whether to render it. A dispatch on w/converge renders its head. The schedule
  # renders the head only when it changed since the last render, whose head is the parent of the tip of w/gallery.
  head:
    name: the head to render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      render: ${{ steps.look.outputs.render }}
      sha: ${{ steps.look.outputs.sha }}
    steps:
      - id: look
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/w/converge" --jq .sha)
          last=$(gh api "repos/$GITHUB_REPOSITORY/commits/w/gallery" --jq '.parents[0].sha' 2>/dev/null || true)
          render=false
          if [ "$EVENT" = workflow_dispatch ]; then
            [ "$REF" = refs/heads/w/converge ] && render=true
          elif [ "$sha" != "$last" ]; then
            render=true
          fi
          echo "w/converge at $sha, last render of $last: render $render"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "render=$render" >> "$GITHUB_OUTPUT"

  render:
    name: the render
    needs: head
    if: needs.head.outputs.render == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # This job pushes w/gallery and edits its pull request as github-actions[bot], with GITHUB_TOKEN, whose push and
    # pull request start no workflow: a render of screenshots runs no gate.
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: w/gallery
      BASE: w/converge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.head.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: none
      - run: |
          echo "CARGO_BUILD_TARGET=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run build
      # The watcher ends the largest capture when the memory of the runner is tight, and says so in the log.
      - run: |
          sh script/memwatch.sh & watch=$!
          trap 'kill "$watch"' EXIT
          bun run screenshots
          bun run animation
      # The files of the render stay for a week, to read them without a checkout.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gallery
          path: |
            docs/screenshots
            docs/furb.gif
          retention-days: 7
      - name: push the render and update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          short=$(git rev-parse --short HEAD)
          title="chore(tui): Show the gallery of w/converge at $short"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A -- docs/screenshots docs/furb.gif
          added=$(git diff --cached --name-only --diff-filter=A | wc -l | tr -d ' ')
          changed=$(git diff --cached --name-only --diff-filter=M | wc -l | tr -d ' ')
          removed=$(git diff --cached --name-only --diff-filter=D | wc -l | tr -d ' ')
          # A render that changes no file still moves the branch to the head, so the branch shows each head it rendered.
          git switch -q -C "$BRANCH"
          git commit -q --allow-empty -m "$title" -m "The render of $head in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          # A pull request of w/gallery into another base, as the old one into main, would take all of this head.
          gh pr list --head "$BRANCH" --state open --json number,baseRefName --jq ".[] | select(.baseRefName != \"$BASE\") | .number" |
            while read -r stray; do gh pr close "$stray" --comment "🤖 The gallery follows w/converge now, on one pull request into it."; done
          git push -q --force "$remote" "$BRANCH"
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat > "$RUNNER_TEMP/body.md" <<EOF
          🤖

          ## Why

          The owner follows the screens of each build of w/converge here, and the QA judges the screens of the head from this branch. So both read the same pictures of the same head.

          ## Outcome

          - This branch shows the gallery of w/converge at $head: docs/screenshots and docs/furb.gif.
          - Against the gallery that this head holds: files added: $added. Files changed: $changed. Files removed: $removed.
          - A runner of CI drew them with bun run screenshots and bun run animation, in $run.
          - Each new head of w/converge, at most once an hour, draws the gallery again on this branch and in this body. No other pull request of the gallery opens.
          - A merge of this pull request puts these files in w/converge, and so in main at its next release.

          ---

          - [x] I am accountable for this diff, whoever or whatever wrote it.
          - [x] It is one change. No part belongs in another PR. No part could be its own PR.
          - [x] Its comments obey AGENTS.md: none.
          - [x] Its prose obeys AGENTS.md: Simplified Technical English, for a general non-technical audience.
          - [x] Every flaw I know of is fixed in this diff or named in \`## Outcome\`.
          - [x] I checked each statement above. I did not assume it.
          EOF
          number=$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh pr create --base "$BASE" --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr edit "$number" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
