name: gallery

# The gallery of the TUI, docs/screenshots and docs/furb.gif, drawn from each head of w/converge that the aggregator
# pushes, so the owner follows the screens of each build and the QA judges the same pictures of the same head. The run
# renders both as `bun run screenshots` and `bun run animation` do on a machine, with the watcher of memory beside them,
# and pushes the head with the render on top to one fixed branch, w/gallery. One pull request of w/gallery into
# w/converge stands, and each later run updates its branch and its body in place, with the head that it shows. The diff
# of that pull request is what the screens of the head changed against the gallery that the head holds.
on:
  push:
    branches: [w/converge]
  workflow_dispatch:

# A push while a render runs waits for it, and a newer push replaces the one that waits: a render that a newer push
# ended would leave no gallery at all, since the aggregator pushes more often than a render ends.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    name: the render
    if: github.ref == 'refs/heads/w/converge'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # This job pushes w/gallery and edits its pull request as github-actions[bot], with GITHUB_TOKEN, whose push and
    # pull request start no workflow: a render of screenshots runs no gate.
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: w/gallery
      BASE: w/converge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: none
      - run: |
          echo "CARGO_BUILD_TARGET=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run build
      # The watcher ends the largest capture when the memory of the runner is tight, and says so in the log.
      - run: |
          sh script/memwatch.sh & watch=$!
          trap 'kill "$watch"' EXIT
          bun run screenshots
          bun run animation
      # The files of the render stay for a week, to read them without a checkout.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gallery
          path: |
            docs/screenshots
            docs/furb.gif
          retention-days: 7
      - name: push the render and update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          short=$(git rev-parse --short HEAD)
          title="chore(tui): Show the gallery of w/converge at $short"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A -- docs/screenshots docs/furb.gif
          added=$(git diff --cached --name-only --diff-filter=A | wc -l | tr -d ' ')
          changed=$(git diff --cached --name-only --diff-filter=M | wc -l | tr -d ' ')
          removed=$(git diff --cached --name-only --diff-filter=D | wc -l | tr -d ' ')
          # A render that changes no file still moves the branch to the head, so the branch shows each head it rendered.
          git switch -q -C "$BRANCH"
          git commit -q --allow-empty -m "$title" -m "The render of $head in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          git push -q --force "$remote" "$BRANCH"
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat > "$RUNNER_TEMP/body.md" <<EOF
          🤖

          ## Why

          The owner follows the screens of each build of w/converge here, and the QA judges the screens of the head from this branch. So both read the same pictures of the same head.

          ## Outcome

          - This branch shows the gallery of w/converge at $head: docs/screenshots and docs/furb.gif.
          - Against the gallery that this head holds: files added: $added. Files changed: $changed. Files removed: $removed.
          - A runner of CI drew them with bun run screenshots and bun run animation, in $run.
          - Each push to w/converge draws the gallery again on this branch and in this body. No other pull request of the gallery opens.

          ---

          - [x] I am accountable for this diff, whoever or whatever wrote it.
          - [x] It is one change. No part belongs in another PR. No part could be its own PR.
          - [x] Its comments obey AGENTS.md: none.
          - [x] Its prose obeys AGENTS.md: Simplified Technical English, for a general non-technical audience.
          - [x] Every flaw I know of is fixed in this diff or named in \`## Outcome\`.
          - [x] I checked each statement above. I did not assume it.
          EOF
          number=$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh pr create --base "$BASE" --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr edit "$number" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
