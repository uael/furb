name: system

# The gates of one system: its build, then the jobs that run what it built and compile nothing. The gates call it once
# for each system that a change needs, so a build waits for no other system, and the jobs of a system wait for its
# build alone.
on:
  workflow_call:
    inputs:
      os:
        description: The runner of the system.
        type: string
        required: true
      suite:
        description: Whether the suite runs on the system.
        type: boolean
        default: false
      crate:
        description: Whether the tests of the crate run on the system.
        type: boolean
        default: false
      typescript:
        description: Whether the bindings and the TUI run on the system.
        type: boolean
        default: false
      head:
        description: The commit that the run proves, when it is not the commit of its ref.
        type: string
        default: ""

env:
  UV_VERSION: "0.12.17"

jobs:
  build:
    # Each system builds once, and each job after it runs what it built and compiles nothing: the program furb and the
    # engine of TypeScript, from one invocation of cargo over the workspace, the tests of the crate, the wheel of
    # furb-monty and the clippy of the crate. A second selection of cargo resolves other features of the dependencies,
    # so the tests of the crate build again only the crates that their dev-dependencies change. The copy of the build
    # goes to the jobs after it as an artifact of a day: the programs and the tests, never the target, which is ten
    # times as large. A build that fails ends each job after it on its system, which reports skipped and gives no test
    # result there, as the last step of this job says, and no job of another system.
    name: the build on ${{ inputs.os }}
    runs-on: ${{ inputs.os }}
    # A change of the lock, of this file or of the script of the build makes every system build each crate from
    # nothing, which took 26 minutes on Windows, and main saves the cache only from a job that passes. A limit shorter
    # than that build fails every later run too, since none finds a cache.
    timeout-minutes: 60
    # One shell on every system. On Windows it is the bash of Git for Windows.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: tools
          hashed: bind/typescript/build.ts
      # napi builds for the triple of the machine, in a folder of its own: cargo builds for it too, so the tests and
      # the package share every dependency.
      - run: |
          echo "CARGO_BUILD_TARGET=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_ENV"
      # The bun:ffi of bun 1.3 builds its native callbacks with TinyCC in pages of the heap of Windows, which lose
      # their right to run code while the process lives, and a call into OpenTUI then crashes. From bun 1.4 on, the
      # engine builds them.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Each program of the tests of the crate, with the folder of its package, which cargo runs it in.
      - run: |
          cargo test --locked --workspace --features furb/typescript --no-run --message-format json-render-diagnostics \
            | tr -d '\r' | jq -r --arg root "$GITHUB_WORKSPACE" '
              def here: gsub("\\\\"; "/") | ltrimstr($root | gsub("\\\\"; "/")) | ltrimstr("/");
              select(.reason == "compiler-artifact" and .executable != null)
              | [(.manifest_path | here | sub("/?Cargo.toml$"; "") | if . == "" then "." else . end),
                 (if .profile.test then "test" else "program" end), .target.name, (.executable | here)]
              | @tsv' | tr -d '\r' > "$RUNNER_TEMP/programs.tsv"
          cat "$RUNNER_TEMP/programs.tsv"
      - run: cargo clippy --locked --workspace --all-targets --features furb/typescript -- -D warnings
      # In the dev profile, as uv sync builds it for the suite: a wheel of the release profile took 10 to 17 minutes.
      - run: uv build --wheel --package furb-monty --out-dir "$RUNNER_TEMP/copy/wheels" -C build-args=--profile=dev
      - run: |
          copy="$RUNNER_TEMP/copy"
          cp "$RUNNER_TEMP/programs.tsv" "$copy/programs.tsv"
          cut -f4 "$RUNNER_TEMP/programs.tsv" | while read -r one; do
            mkdir -p "$copy/$(dirname "$one")" && cp "$one" "$copy/$one"
          done
          mkdir -p "$copy/bind/typescript"
          cp bind/typescript/furb.*.node bind/typescript/index.cjs bind/typescript/index.d.cts "$copy/bind/typescript/"
          cp bind/typescript/furb* "$copy/bind/typescript/" 2> /dev/null || true
          cp -R bind/typescript/dist "$copy/bind/typescript/dist"
          du -sh "$copy"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ inputs.os }}
          path: ${{ runner.temp }}/copy
          retention-days: 1
      - uses: ./.github/actions/clear
      - if: failure()
        run: >-
          echo "::error title=No test ran on ${{ inputs.os }}::The build on ${{ inputs.os }} failed, so the suite, the
          crate and the bindings and the TUI on ${{ inputs.os }} report skipped and gave no test result: a skipped job
          there is no pass."

  suite:
    # The engine speaks to a machine through the World, and a machine answers as itself: the suite runs on each,
    # and on both engines, the one of the interpreter and the one in the sandbox of monty, which the wheel of the build
    # of its system holds.
    name: the suite on ${{ inputs.os }}
    needs: build
    if: inputs.suite
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    # On Windows the commands of the tests run in the sh of Git for Windows, which the bash of Git puts on PATH.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: tools
          rust: none
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-${{ inputs.os }}
          path: ${{ runner.temp }}/build
      # Each package that the suite imports, furb-monty from the wheel that the build made, so nothing compiles here.
      - run: |
          uv sync --locked --no-install-package furb-cli --no-install-package furb-monty
          uv pip install --no-deps "$RUNNER_TEMP"/build/wheels/furb_monty-*.whl
      # The test of the walls counts tokens with a vocabulary that tiktoken downloads at its first use. A download that
      # stalls past the 30 seconds of a test ends the worker of the suite, which reports a crash and no cause, so the
      # vocabulary comes here, where a stall is bounded, and the suite reads it from disk.
      - run: echo "TIKTOKEN_CACHE_DIR=$RUNNER_TEMP/tiktoken" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tiktoken
          key: tiktoken-o200k_base
      - run: |
          for try in 1 2 3; do
            uv run python -c "import socket, tiktoken; socket.setdefaulttimeout(60); tiktoken.get_encoding('o200k_base')" && exit 0
          done
          exit 1
        timeout-minutes: 5
        env:
          UV_NO_SYNC: "1"
      # The run syncs nothing, so it does not build the program furb, and no package of the workspace again.
      - run: uv run python script/budget.py pytest -- uv run pytest -q --durations=25
        env:
          UV_NO_SYNC: "1"
          FURB_UNCOUNTED: ${{ runner.os == 'Windows' && '*/src/furb/life.py' || '' }}
      # What the walls of the engine and of the doctrine leave, as the script of the tokens says it, kept as an artifact.
      - if: always() && runner.os == 'Linux'
        env:
          UV_NO_SYNC: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/measures"
          uv run python script/tokens.py > "$RUNNER_TEMP/measures/tokens.txt" 2>&1 || echo "exit $?" >> "$RUNNER_TEMP/measures/tokens.txt"
      - if: always() && runner.os == 'Linux'
        uses: ./.github/actions/measures
        with:
          name: tokens

  crate:
    # The tests of the crate and of the command line, which the build of each system compiled: each program runs in the
    # folder of its package, as cargo runs it, and a program that fails leaves the others to run, so the log names each
    # red test. The clippy of the crate ran in the build. On macOS the job runs the tests of the crate and the kill
    # matrix of the daemon alone, which ends it with the signals of Unix, as it did when it built them there.
    name: the crate on ${{ inputs.os }}
    needs: build
    if: inputs.crate
    runs-on: ${{ inputs.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: none
          rust: none
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-${{ inputs.os }}
          path: .
      - run: |
          # An artifact keeps no mode, and a test runs the programs and the examples beside it.
          cut -f4 programs.tsv | while read -r one; do chmod +x "$one"; done
          failed=0
          while IFS="$(printf '\t')" read -r folder kind name program; do
            [ "$kind" = test ] || continue
            filter=""
            if [ "$RUNNER_OS" = macOS ] && [ "$folder" != . ]; then
              [ "$folder" = cli ] && [ "$name" = suite ] || continue
              filter=kills::
            fi
            echo "::group::$folder $name"
            (cd "$folder" && CARGO_MANIFEST_DIR="$GITHUB_WORKSPACE/$folder" "$GITHUB_WORKSPACE/$program" $filter) || failed=1
            echo "::endgroup::"
          done < programs.tsv
          exit $failed

  typescript:
    name: the bindings and the TUI on ${{ inputs.os }}
    needs: build
    if: inputs.typescript
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    # One shell on every system. On Windows it is the bash of Git for Windows, which puts on PATH the sh and the tools
    # that the commands of the tests run.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: none
          rust: none
      # The engine, its loader, its types, the built package and the program furb, as the build of the system made them.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-${{ inputs.os }}
          path: ${{ runner.temp }}/build
      - run: |
          cp -R "$RUNNER_TEMP/build/bind/typescript/." bind/typescript/
          chmod +x bind/typescript/furb* 2> /dev/null || true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run docs
      - run: git diff --exit-code -- bind/typescript/index.d.cts tui/README.md
      - run: bun run check
      - run: bun run lint
      - run: bun run test
