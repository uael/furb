name: publish

# A tag that names a version publishes that version to PyPI. PyPI is told to trust this workflow of this
# repository, so no token is kept anywhere: the job asks GitHub for a short lived identity and PyPI reads it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating tag above v7, so this names the version it is pinned to.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
      - run: uv build
      - run: uv publish --trusted-publishing always
