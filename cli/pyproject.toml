[project]
name = "furb-cli"
# maturin takes the version of the crate, which is the version of the workspace.
dynamic = ["version"]
description = "furb, the command line: the TUI, a JSON-RPC on stdin and stdout, and one command on one life."
requires-python = ">=3.14"
# The license of the repository stands over this too; maturin reads no file above its own directory, so the
# distribution names the license and carries none of its own.
license = "AGPL-3.0-only"
authors = [{ name = "Abel Lucas", email = "uaelucas@gmail.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Rust",
]

[project.urls]
Source = "https://github.com/uael/furb"
Issues = "https://github.com/uael/furb/issues"

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
# The program furb, and no module of python: the wheel puts it among the scripts of the environment, so the package
# furb, which depends on this one, gives the command furb.
bindings = "bin"
# The symbols of debugging are a third of the program, and no user of the wheel reads them.
strip = true

# The files that the build of the crate reads. When one of them changes, the next sync builds the package again, so a
# change of the engine reaches the suite with no reinstall.
[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "../Cargo.toml" },
  { file = "../Cargo.lock" },
  { file = "../build.rs" },
  { file = "../src/**/*.rs" },
  { file = "../src/**/*.py" },
  { file = "../src/**/*.pyi" },
  { file = "../src/**/*.json" },
  { file = "../extensions/*/*.py" },
  { file = "../extensions/*/furb.json" },
  { file = "../extensions/*/*/SKILL.md" },
  { file = "Cargo.toml" },
  { file = "src/**/*.rs" },
]
